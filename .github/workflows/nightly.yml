name: Nightly LABUBU Refresh & Manuscript Build

on:
  schedule:
    # Runs nightly at 06:00 UTC (12:00 AM MDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths:
      - '**.R'
      - '**.Rmd'
      - '**.csv'
      - '.github/workflows/*.yml'

# A nightly that auto-commits must not race with itself or with a manual run;
# without this two runs can both push to main.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write        # push a branch (never main directly)
  pull-requests: write   # open the review PR

env:
  # Pinned. An unpinned mysterycall means a package commit can silently change
  # the auto-committed manuscript with no diff in this repo.
  MYSTERYCALL_SHA: 42d66d92ef52a0f85d1f7c61208c2ddd79d9c06e

jobs:
  nightly-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Explicit `packages:` (not the default `deps::.`, which tries to resolve
      # the GitHub-only mysterycall from CRAN) and hard deps only (Suggests
      # drag in pbkrtest -> doBy -> Deriv, and Deriv is archived from CRAN).
      # glmmTMB is therefore absent; mysterycall_hurdle_wait() is wrapped in
      # tryCatch and degrades to "hurdle model not run".
      - name: Query R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::sessioninfo
          extra-packages: |
            any::dplyr
            any::ggplot2
            any::ggbeeswarm
            any::ggridges
            any::patchwork
            any::scales
            any::forcats
            any::lme4
            any::geepack
            any::knitr
            any::rmarkdown
            any::survival
            any::readr
            any::remotes
            any::httr
            any::jsonlite

      # Deriv was archived from CRAN, which takes glmmTMB down with it:
      #   glmmTMB -> pbkrtest -> doBy (>= 4.6.22) -> Deriv
      #
      # Pinned to 4.2.0, NOT the newest archived 4.3.0. 4.3.0 calls
      # R_ClosureFormals(), a C API entry point added in R 4.5.0, so it fails
      # to compile on the R 4.4.2 this project pins:
      #   derive_simplif.cpp:376: error: 'R_ClosureFormals' was not declared
      # That R requirement is why the package left CRAN in the first place.
      # 4.2.0 is the version already proven against R 4.4.2 in the analysis
      # environment this pipeline is meant to reproduce.
      #
      # Without glmmTMB the pipeline still runs, but mysterycall_hurdle_wait()
      # degrades to "hurdle model not run" and the nightly commits a report
      # with the two-part model missing.
      # Single source of truth for the pinned analytical dependency. A SHA
      # copied by hand into three workflows drifts, and a drifted SHA silently
      # changes results. check-workflow-contract.R enforces that they agree.
      - name: Resolve pinned mysterycall SHA
        run: echo "MYSTERYCALL_SHA=$(cat .github/mysterycall-sha.txt)" >> "$GITHUB_ENV"

      - name: Install archived Deriv, then glmmTMB
        shell: Rscript {0}
        run: |
          if (!requireNamespace("Deriv", quietly = TRUE))
            install.packages(
              "https://cran.r-project.org/src/contrib/Archive/Deriv/Deriv_4.2.0.tar.gz",
              repos = NULL, type = "source")
          if (!requireNamespace("Deriv", quietly = TRUE))
            stop("Deriv failed to install; glmmTMB cannot be built")
          install.packages("glmmTMB")
          if (!requireNamespace("glmmTMB", quietly = TRUE))
            stop("glmmTMB failed to install; the hurdle model would be silently ",
                 "dropped from the committed report")
          cat("glmmTMB", as.character(utils::packageVersion("glmmTMB")), "\n")

      - name: Install mysterycall at the pinned SHA
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: Rscript {0}
        run: |
          remotes::install_github(paste0("mufflyt/mysterycall@", Sys.getenv("MYSTERYCALL_SHA")),
                                  upgrade = "never")
          if (!requireNamespace("mysterycall", quietly = TRUE))
            stop("mysterycall failed to install; refusing to auto-commit results ",
                 "produced without it")

      - name: Environment preflight
        run: Rscript .github/scripts/preflight-env.R

      - name: Run LABUBU Refresh Pipeline
        env:
          REDCAP_LABUBU_TOKEN: ${{ secrets.REDCAP_LABUBU_TOKEN }}
        run: |
          if [ -n "$REDCAP_LABUBU_TOKEN" ]; then
            echo "REDCAP_LABUBU_TOKEN secret found. Pulling latest export from REDCap API..."
            Rscript refresh.R --pull
          else
            echo "No REDCap API secret found. Running refresh on newest repository export..."
            Rscript refresh.R
          fi

      # The gate runs BEFORE the manuscript is rendered and committed. An
      # unvalidated auto-commit to main is how a defective analysis stayed
      # publishable-looking for months; the nightly must not push results that
      # fail the structural invariants.
      - name: Pipeline completion receipt
        run: Rscript .github/scripts/pipeline-receipt.R

      - name: Data contract
        run: Rscript .github/scripts/data-contract.R

      - name: Scientific gate
        run: Rscript .github/scripts/scientific-gate.R

      # Headline estimands in one diffable table, then classified against the
      # committed baseline. Exit 2 means something moved beyond tolerance and a
      # human should look; it does not fail the run on its own, because the
      # drift check below decides whether that warrants a pull request.
      - name: Estimand report
        run: Rscript .github/scripts/estimand-report.R

      - name: Estimand drift
        run: Rscript .github/scripts/estimand-diff.R || true

      - name: Render Reproducible Manuscript (Word & HTML)
        run: |
          Rscript -e 'rmarkdown::render("labubu_mysterycall_manuscript.Rmd", output_format="all")'

      # A scheduled job must never rewrite main because a fresh run produced
      # different numbers. It did exactly that once (f1b3fb6), and the commit
      # silently dropped the two-part model from the report because glmmTMB was
      # missing -- a scientific change, merged with no review.
      #
      # Drift now opens a pull request instead. Automation still does the work;
      # a human still approves the science.
      - name: Detect drift and open a review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add mysterycall_outputs/ PROVENANCE.md ci-results/estimand-diff.csv \
                  labubu_mysterycall_manuscript.html \
                  labubu_mysterycall_manuscript.docx || true

          if git diff --staged --quiet; then
            echo "No drift: regenerated artifacts match main."
            echo "DRIFT=none" >> "$GITHUB_ENV"
            exit 0
          fi

          # PROVENANCE.md and the evaluation report stamp a generation time and
          # the current commit, and ggplot re-renders figures byte-differently
          # every run. Without this, the nightly would open a pull request
          # every night regardless of whether anything scientific moved --
          # which trains reviewers to ignore nightly PRs.
          if ! Rscript .github/scripts/check-drift.R; then
            echo "DRIFT=cosmetic" >> "$GITHUB_ENV"
            exit 0
          fi

          BRANCH="nightly/refresh-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "Nightly refresh: regenerated outputs differ from main

          Scientific gate passed at mysterycall@${MYSTERYCALL_SHA}.
          Review the diff before merging: a change here is a change to the
          study's reported results."
          git push origin "$BRANCH"

          # Opening the PR can be refused by a repository setting
          # ("Allow GitHub Actions to create and approve pull requests",
          # Settings -> Actions -> General). The branch is already pushed and
          # the drift is preserved either way, so a refusal must not read as a
          # pipeline failure -- but it must not be silent either.
          if ! gh pr create --base main --head "$BRANCH" \
            --title "Nightly refresh: regenerated outputs differ from main" \
            --body "Automated nightly run regenerated the analysis and the outputs differ from \`main\`.

          The scientific gate passed, so this is drift rather than breakage — but it is still a change to reported results and needs review.

          Check before merging:
          - \`ci-results/denominator-audit.csv\` for cohort changes
          - \`mysterycall_outputs/mysterycall_evaluation.md\` for estimate changes
          - that no model reads \"not run\"

          Generated by the nightly workflow at mysterycall@\`${MYSTERYCALL_SHA}\`."
          then
            echo "::warning title=Drift branch pushed, PR not opened::Could not open a PR (GitHub Actions may be barred from creating pull requests in this repository's settings). The branch $BRANCH is pushed and contains the drift; open a PR from it manually: https://github.com/${GITHUB_REPOSITORY}/compare/main...$BRANCH"
            echo "DRIFT=branch-only" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "DRIFT=pr-opened" >> "$GITHUB_ENV"

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: |
            ci-results/
            mysterycall_outputs/
          retention-days: 14
          if-no-files-found: warn
