name: Data Validation & Scientific Gate

# The fast PR gate. Runs the pipeline and then asserts the structural
# invariants in .github/scripts/scientific-gate.R. A PR must never go green
# because a check was skipped, so the gate fails closed and the self-test
# proves the gate itself can still fail.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Without this, pushing twice to a PR runs two pipelines against the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job reads code and uploads artifacts, nothing else.
permissions:
  contents: read

env:
  # Pinned, not floating. The analysis depends on package behaviour that can
  # change silently under `main` -- mysterycall_exclusion_crosswalk() contents
  # and mysterycall_lmm(auto_log=) in particular -- and an unpinned install
  # means a package commit can change the manuscript with no diff in this repo.
  MYSTERYCALL_SHA: 42d66d92ef52a0f85d1f7c61208c2ddd79d9c06e

jobs:
  validate:
    name: pipeline + scientific gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::dplyr
            any::ggplot2
            any::ggbeeswarm
            any::ggridges
            any::patchwork
            any::scales
            any::forcats
            any::lme4
            any::glmmTMB
            any::geepack
            any::knitr
            any::rmarkdown
            any::survival
            any::readr
            any::remotes
            any::pak
            any::httr
            any::jsonlite

      # Record the environment BEFORE anything that can fail, so an early
      # failure still leaves a downloadable artifact instead of burying the
      # real error under a failed upload.
      - name: Record the environment
        if: always()
        shell: Rscript {0}
        run: |
          dir.create("ci-results", showWarnings = FALSE)
          writeLines(utils::capture.output(utils::sessionInfo()), "ci-results/sessionInfo.txt")
          writeLines(c(paste0("mysterycall_sha=", Sys.getenv("MYSTERYCALL_SHA")),
                       paste0("r_version=", as.character(getRversion())),
                       paste0("commit=", Sys.getenv("GITHUB_SHA"))),
                     "ci-results/run-parameters.txt")

      # Fail closed. install_github() surfaces errors, but a partially usable
      # install would let the pipeline run with a stale package and report
      # green -- the exact false signal this gate exists to prevent.
      - name: Install mysterycall at the pinned SHA
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: Rscript {0}
        run: |
          remotes::install_github(paste0("mufflyt/mysterycall@", Sys.getenv("MYSTERYCALL_SHA")),
                                  upgrade = "never")
          if (!requireNamespace("mysterycall", quietly = TRUE))
            stop("mysterycall failed to install; refusing to run a pipeline that ",
                 "would skip every package-backed check and report green")
          cat("mysterycall", as.character(utils::packageVersion("mysterycall")), "\n")

      - name: Run the pipeline
        run: Rscript -e 'source("evaluate_labubu_mysterycall.R")'

      - name: Regenerate provenance
        run: Rscript provenance.R

      # "Did the gate work" and "did the study pass" are separate signals.
      - name: Gate self-test
        run: Rscript .github/scripts/gate-selftest.R

      - name: Scientific gate
        run: Rscript .github/scripts/scientific-gate.R

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labubu-ci-${{ github.run_id }}
          path: |
            ci-results/
            mysterycall_outputs/
          retention-days: 14
          if-no-files-found: error
