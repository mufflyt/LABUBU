name: Render Manuscript & Publish Artifacts

on:
  push:
    branches:
      - main
    paths:
      - 'labubu_mysterycall_manuscript.Rmd'
      - 'evaluate_labubu_mysterycall.R'
      - 'refresh.R'
      - 'mysterycall_outputs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MYSTERYCALL_SHA: 42d66d92ef52a0f85d1f7c61208c2ddd79d9c06e

jobs:
  render-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Query R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::dplyr
            any::ggplot2
            any::ggbeeswarm
            any::ggridges
            any::patchwork
            any::scales
            any::forcats
            any::lme4
            any::glmmTMB
            any::geepack
            any::knitr
            any::rmarkdown
            any::survival
            any::readr
            any::remotes

      # The manuscript now computes every number inline via mysterycall
      # (prevalence_ci, abstract_numbers, logistic_model, lmm), so this
      # workflow needs the package -- it previously rendered without it.
      - name: Install mysterycall at the pinned SHA
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: Rscript {0}
        run: |
          remotes::install_github(paste0("mufflyt/mysterycall@", Sys.getenv("MYSTERYCALL_SHA")),
                                  upgrade = "never")
          if (!requireNamespace("mysterycall", quietly = TRUE))
            stop("mysterycall failed to install; the manuscript cannot render its numbers")

      - name: Render Manuscript (HTML and Word)
        run: |
          Rscript -e 'rmarkdown::render("labubu_mysterycall_manuscript.Rmd", output_format="all")'

      - name: Upload HTML Manuscript Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LABUBU_Manuscript_HTML
          path: labubu_mysterycall_manuscript.html
          if-no-files-found: error

      - name: Upload Word Manuscript Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LABUBU_Manuscript_Word
          path: labubu_mysterycall_manuscript.docx
          if-no-files-found: error
